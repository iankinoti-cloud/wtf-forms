<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}WTF Forms{% endblock %}</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Inter', system-ui, sans-serif;
            background: #0a0a0a;
            color: #1a1a1a;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .container { width: 100%; max-width: 460px; padding: 0 16px; }

        /* ── CARD WRAPPER (positions character above card) ── */
        .card-wrapper {
            position: relative;
            padding-top: 42px;
        }

        .card {
            background: #fff;
            border-radius: 16px;
            padding: 40px 36px 36px;
            box-shadow: 0 24px 64px rgba(0,0,0,0.4);
            position: relative;
            overflow: visible;
            z-index: 1;
        }

        /* Watermark clip wrapper */
        .card-inner {
            position: absolute;
            inset: 0;
            border-radius: 16px;
            overflow: hidden;
            pointer-events: none;
            z-index: 0;
        }

        /* Subtle full-card watermark — toned down, badge owns the brand presence */
        .card-inner::before {
            content: '';
            position: absolute;
            inset: 0;
            background: url("{{ url_for('static', filename='ian_creative.jpeg') }}") center/45% no-repeat;
            filter: invert(1);
            opacity: 0.032;
        }

        /* ── BRAND BADGE — top-right of card, outside card div ── */
        .brand-badge {
            position: absolute;
            top: calc(42px + 18px);   /* card-wrapper padding + inset from card top */
            right: 20px;
            width: 54px;
            height: 54px;
            border-radius: 50%;
            overflow: hidden;
            z-index: 5;
            background: #0a0a0a;
            box-shadow: 0 4px 14px rgba(0,0,0,0.3);
        }

        .brand-badge img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: center 62%;
            display: block;
        }

        .card > *:not(.card-inner) { position: relative; z-index: 1; }

        /* ── CHARACTER ── */
        .character {
            position: absolute;
            top: 0;
            left: 50%;
            transform-origin: bottom center;
            z-index: 10;
            animation:
                land   0.85s cubic-bezier(0.22, 1, 0.36, 1) 0.3s both,
                breathe 3.2s ease-in-out 1.4s infinite;
        }

        /* Shadow under character */
        .char-shadow {
            width: 44px;
            height: 8px;
            background: rgba(0,0,0,0.15);
            border-radius: 50%;
            margin: 0 auto;
            animation: shadow-pulse 3.2s ease-in-out 1.4s infinite;
            filter: blur(2px);
        }

        /* Head */
        .char-head {
            width: 54px;
            height: 50px;
            background: #0a0a0a;
            border-radius: 50% 50% 42% 42%;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 11px;
            margin: 0 auto;
            position: relative;
            box-shadow: 0 6px 16px rgba(0,0,0,0.35);
        }

        /* Tiny antenna */
        .char-head::before {
            content: '';
            position: absolute;
            top: -10px;
            left: 50%;
            transform: translateX(-50%);
            width: 3px;
            height: 10px;
            background: #0a0a0a;
            border-radius: 2px 2px 0 0;
        }

        .char-head::after {
            content: '';
            position: absolute;
            top: -15px;
            left: 50%;
            transform: translateX(-50%);
            width: 7px;
            height: 7px;
            background: #0a0a0a;
            border-radius: 50%;
        }

        /* Eyes */
        .eye {
            width: 11px;
            height: 11px;
            background: #fff;
            border-radius: 50%;
            position: relative;
            animation: blink 4.5s ease-in-out 2s infinite;
        }

        .eye::after {
            content: '';
            position: absolute;
            width: 5px;
            height: 5px;
            background: #0a0a0a;
            border-radius: 50%;
            top: 3px;
            left: 3px;
        }

        .eye.right { animation-delay: 2.08s; }

        /* Body */
        .char-body {
            width: 34px;
            height: 26px;
            background: #0a0a0a;
            border-radius: 5px 5px 2px 2px;
            margin: 2px auto 0;
        }

        /* Base / feet */
        .char-base {
            width: 46px;
            height: 13px;
            background: #0a0a0a;
            border-radius: 2px 2px 18px 18px;
            margin: 0 auto;
        }

        /* ── ANIMATIONS ── */
        @keyframes land {
            0%   { transform: translateX(-50%) translateY(-320px) scaleX(1)    scaleY(1); }
            68%  { transform: translateX(-50%) translateY(0px)    scaleX(1)    scaleY(1);    animation-timing-function: ease-out; }
            76%  { transform: translateX(-50%) translateY(2px)    scaleX(1.32) scaleY(0.62); }
            86%  { transform: translateX(-50%) translateY(-14px)  scaleX(0.9)  scaleY(1.12); }
            93%  { transform: translateX(-50%) translateY(1px)    scaleX(1.06) scaleY(0.96); }
            100% { transform: translateX(-50%) translateY(0px)    scaleX(1)    scaleY(1); }
        }

        @keyframes breathe {
            0%, 100% { transform: translateX(-50%) translateY(0px)  scaleY(1);    }
            50%       { transform: translateX(-50%) translateY(-5px) scaleY(1.04); }
        }

        @keyframes shadow-pulse {
            0%, 100% { transform: scaleX(1);    opacity: 1;   }
            50%       { transform: scaleX(0.75); opacity: 0.6; }
        }

        @keyframes blink {
            0%, 90%, 100% { transform: scaleY(1); }
            94%            { transform: scaleY(0.08); }
        }

        /* ── ERROR STATE — character turns red ── */
        .character.char-error .char-head,
        .character.char-error .char-body,
        .character.char-error .char-base {
            background: #dc2626;
            transition: background 0.3s ease;
        }

        .character.char-error {
            animation:
                land  0.85s cubic-bezier(0.22, 1, 0.36, 1) 0.3s both,
                shake 0.5s cubic-bezier(0.36, 0.07, 0.19, 0.97) 1.2s both,
                breathe-r 3.2s ease-in-out 1.9s infinite;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(-50%) translateY(0); }
            15%       { transform: translateX(calc(-50% + 8px)) translateY(0); }
            30%       { transform: translateX(calc(-50% - 8px)) translateY(0); }
            45%       { transform: translateX(calc(-50% + 5px)) translateY(0); }
            60%       { transform: translateX(calc(-50% - 5px)) translateY(0); }
            75%       { transform: translateX(calc(-50% + 2px)) translateY(0); }
        }

        @keyframes breathe-r {
            0%, 100% { transform: translateX(-50%) translateY(0px); }
            50%       { transform: translateX(-50%) translateY(-5px); }
        }

        /* ── SUCCESS STATE — character turns green ── */
        .character.char-success .char-head,
        .character.char-success .char-body,
        .character.char-success .char-base {
            background: #16a34a;
            transition: background 0.5s ease 0.2s;
        }

        .character.char-success {
            animation:
                land      0.85s cubic-bezier(0.22, 1, 0.36, 1) 0.3s both,
                celebrate 0.5s cubic-bezier(0.34, 1.56, 0.64, 1) 1.2s both,
                breathe-g 3.2s ease-in-out 1.9s infinite;
        }

        @keyframes celebrate {
            0%   { transform: translateX(-50%) translateY(0px) scaleX(1) scaleY(1); }
            40%  { transform: translateX(-50%) translateY(-22px) scaleX(0.9) scaleY(1.15); }
            70%  { transform: translateX(-50%) translateY(0px) scaleX(1.1) scaleY(0.9); }
            100% { transform: translateX(-50%) translateY(0px) scaleX(1) scaleY(1); }
        }

        @keyframes breathe-g {
            0%, 100% { transform: translateX(-50%) translateY(0px); }
            50%       { transform: translateX(-50%) translateY(-5px); }
        }

        /* ── FORM STYLES ── */
        h1 {
            margin-bottom: 6px;
            font-size: 1.6rem;
            font-weight: 700;
            color: #0a0a0a;
            letter-spacing: -0.5px;
        }

        .subtitle {
            font-size: 0.875rem;
            color: #888;
            margin-bottom: 28px;
        }

        .form-group { margin-bottom: 18px; }

        label {
            display: block;
            font-size: 0.8rem;
            font-weight: 600;
            color: #444;
            margin-bottom: 6px;
            letter-spacing: 0.3px;
            text-transform: uppercase;
        }

        input[type=text], input[type=email], input[type=password] {
            width: 100%;
            padding: 11px 14px;
            border: 1.5px solid #e5e5e5;
            border-radius: 10px;
            font-size: 0.95rem;
            font-family: inherit;
            color: #1a1a1a;
            background: #fafafa;
            transition: border-color .2s, box-shadow .2s, background .2s;
        }

        input:focus {
            outline: none;
            border-color: #0a0a0a;
            background: #fff;
            box-shadow: 0 0 0 3px rgba(10,10,10,0.06);
        }

        input::placeholder { color: #bbb; }

        .error {
            color: #dc2626;
            font-size: 0.78rem;
            margin-top: 5px;
        }

        button[type=submit], input[type=submit] {
            width: 100%;
            padding: 13px;
            margin-top: 10px;
            background: #0a0a0a;
            color: #fff;
            border: none;
            border-radius: 10px;
            font-size: 0.95rem;
            font-weight: 600;
            font-family: inherit;
            letter-spacing: 0.3px;
            cursor: pointer;
            transition: background .2s, transform .15s, box-shadow .2s;
            box-shadow: 0 4px 14px rgba(0,0,0,0.25);
        }

        button[type=submit]:hover, input[type=submit]:hover {
            background: #222;
            box-shadow: 0 6px 20px rgba(0,0,0,0.35);
            transform: translateY(-1px);
        }

        button[type=submit]:active, input[type=submit]:active {
            transform: translateY(0);
            box-shadow: 0 2px 8px rgba(0,0,0,0.2);
        }

        .alert { padding: 12px 16px; border-radius: 10px; margin-bottom: 20px; font-size: 0.875rem; }
        .alert-success { background: #d1fae5; color: #065f46; }
        .alert-danger  { background: #fee2e2; color: #991b1b; }
    </style>
    {% block head %}{% endblock %}
</head>
<body>
    <div class="container">
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% for category, message in messages %}
                <div class="alert alert-{{ category }}">{{ message }}</div>
            {% endfor %}
        {% endwith %}

        <div class="card-wrapper">
            <!-- Animated character -->
            <div class="character{% if registered %} char-success{% elif has_errors %} char-error{% endif %}">
                <div class="char-head">
                    <div class="eye left"></div>
                    <div class="eye right"></div>
                </div>
                <div class="char-body"></div>
                <div class="char-base"></div>
            </div>
            <div class="char-shadow"></div>

            <div class="brand-badge">
                <img src="{{ url_for('static', filename='ian_creative.jpeg') }}" alt="IAN Creative">
            </div>
            <div class="card">
                <div class="card-inner"></div>
                {% block content %}{% endblock %}
            </div>
        </div>
    </div>
</body>
</html>
